# Build + release Baselode Viewer for macOS / Windows / Linux.
#
# Triggers:
#   - Push of a SemVer tag (e.g. v0.1.5).  The leading 'v' is stripped before
#     it gets written into package.json / tauri.conf.json / Cargo.toml.
#   - Manual workflow_dispatch with a `version` input (e.g. 0.1.5).  This is
#     the convenient way to cut a release without first creating a tag locally
#     — the workflow tags the repo for you.
#
# The build matrix produces:
#   - macOS  → .app bundle (we disabled .dmg in tauri.conf.json)
#   - Windows → .msi + NSIS .exe
#   - Linux  → .deb + .AppImage
#
# Artefacts are attached to a published GitHub Release automatically.

name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.1.5, no leading v)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      tag: ${{ steps.compute.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute version
        id: compute
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-.*)?$'; then
            echo "::error::Invalid version '$VERSION'.  Use SemVer like 0.1.5."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Create tag (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.compute.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping create."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

  build:
    name: Build (${{ matrix.platform }})
    needs: resolve-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
            tauri-args: '--target universal-apple-darwin'
          - platform: windows-latest
            rust-targets: ''
            tauri-args: ''
          - platform: ubuntu-22.04
            rust-targets: ''
            tauri-args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          # No `cache: 'npm'` — the setup-node cache keys off a lockfile,
          # which this repo intentionally does not commit (deps float to
          # latest). With no lockfile the cache step errors out.

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Inject release version into source files
        shell: bash
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -euo pipefail
          echo "Writing version $VERSION into package.json, tauri.conf.json, Cargo.toml"
          npm version "$VERSION" --no-git-tag-version --allow-same-version >/dev/null
          # tauri.conf.json — use jq
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > src-tauri/tauri.conf.json.tmp
          mv src-tauri/tauri.conf.json.tmp src-tauri/tauri.conf.json
          # Cargo.toml — replace only the [package] version line (first match)
          python3 - "$VERSION" <<'PY'
          import re, sys, pathlib
          version = sys.argv[1]
          path = pathlib.Path('src-tauri/Cargo.toml')
          text = path.read_text()
          new = re.sub(r'(?m)^version\s*=\s*"[^"]*"', f'version = "{version}"', text, count=1)
          path.write_text(new)
          PY
          echo "---"
          grep '"version"' package.json | head -1
          grep '"version"' src-tauri/tauri.conf.json | head -1
          grep -m1 '^version' src-tauri/Cargo.toml

      - name: Install npm dependencies
        # `npm install` (not `npm ci`): no lockfile is committed, so each
        # release resolves the latest published version of every dependency.
        run: npm install

      - name: Import Apple Developer ID certificate
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail

          if [[ -z "$APPLE_CERTIFICATE" || -z "$APPLE_CERTIFICATE_PASSWORD" ]]; then
            echo "::error::Set APPLE_CERTIFICATE and APPLE_CERTIFICATE_PASSWORD in GitHub Actions secrets."
            exit 1
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/baselode-build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          CERTIFICATE_PATH="$RUNNER_TEMP/apple-developer-id.p12"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm -f "$CERTIFICATE_PATH"

          SIGNING_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)"
          if [[ -z "$SIGNING_IDENTITY" ]]; then
            echo "::error::The certificate must be a valid Developer ID Application identity."
            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "Imported signing identity: $SIGNING_IDENTITY"

          # App Store Connect API key notarization is preferred when configured.
          # Otherwise Tauri uses APPLE_ID + APPLE_PASSWORD + APPLE_TEAM_ID.
          if [[ -n "$APPLE_API_KEY_BASE64" ]]; then
            if [[ -z "$APPLE_API_KEY" || -z "$APPLE_API_ISSUER" ]]; then
              echo "::error::Set APPLE_API_KEY and APPLE_API_ISSUER when using APPLE_API_KEY_BASE64."
              exit 1
            fi
            API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
            printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$API_KEY_PATH"
            chmod 600 "$API_KEY_PATH"
            echo "APPLE_API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"
          elif [[ -z "$APPLE_ID" || -z "$APPLE_PASSWORD" || -z "$APPLE_TEAM_ID" ]]; then
            echo "::error::Set APPLE_ID, APPLE_PASSWORD, and APPLE_TEAM_ID, or configure the complete App Store Connect API key secrets."
            exit 1
          fi

      - name: Build + bundle (Tauri)
        uses: tauri-apps/tauri-action@v0.6.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && env.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_TEAM_ID || '' }}
          APPLE_API_KEY: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_ISSUER: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY_PATH: ${{ matrix.platform == 'macos-latest' && env.APPLE_API_KEY_PATH || '' }}
        with:
          tagName: ${{ needs.resolve-version.outputs.tag }}
          releaseName: 'Baselode Viewer ${{ needs.resolve-version.outputs.tag }}'
          releaseBody: |
            Baselode Viewer ${{ needs.resolve-version.outputs.tag }}

            Bundled artefacts for macOS (universal .app), Windows (.msi / .exe),
            and Linux (.deb / .AppImage).  Sourced from tag `${{ needs.resolve-version.outputs.tag }}`.
          releaseDraft: false
          prerelease: false
          assetNamePattern: ${{ matrix.platform == 'macos-latest' && '[name]_[version]_mac[ext]' || '' }}
          args: ${{ matrix.tauri-args }}
